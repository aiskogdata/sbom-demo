version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "5 * * * *"

    ignore:
      - dependency-name: "Duende.*"

    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"        # optional, add/remove depending on what you consider MS-owned
      others:
        patterns:
          - "*"               # everything else
        exclude-patterns:
          - "Microsoft.*"
          - "System.*"
          - "Duende.*"
