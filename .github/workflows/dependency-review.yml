name: 'Dependency Review PR Comment'
on:
  pull_request:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Dependency Review CLI
        run: npm install -g dependency-review-cli
      
      - name: Run Dependency Review and capture full summary
        id: review
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}       # e.g., user/repo
          GITHUB_REF: ${{ github.ref }}
        run: |
          # Capture output even if CLI exits non-zero
          dr_output=$(npx dependency-review-cli \
            --fail-on-severity critical \
            --owner "${GITHUB_REPOSITORY%%/*}" \
            --repo "${GITHUB_REPOSITORY##*/}" \
            2>&1 || true)
          echo "$dr_output"
          echo "SUMMARY<<EOF" >> $GITHUB_OUTPUT
          echo "$dr_output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash
      - name: Post Dependency Review summary as PR comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### Dependency Review Summary
            ```
            ${{ steps.review.outputs.SUMMARY }}
            ```
