name: 'Dependency Review PR Comment'
on:
  pull_request:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Dependency Review CLI
        run: npm install -g @github/dependency-review-cli

      - name: Run Dependency Review and capture full summary
        id: review
        run: |
          mkdir -p dr_output
          # Run the CLI, capture stdout including Scorecard
          dr_output=$(npx @github/dependency-review-cli --fail-on-severity critical 2>&1)
          echo "$dr_output"
          # Save output for GitHub Actions step output
          echo "SUMMARY<<EOF" >> $GITHUB_OUTPUT
          echo "$dr_output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Dependency Review summary as PR comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### Dependency Review Summary
            ```
            ${{ steps.review.outputs.SUMMARY }}
            ```
