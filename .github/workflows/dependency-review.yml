name: 'Dependency Review PR Comment'
on:
  pull_request:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Run Dependency Review
        uses: actions/dependency-review-action@v4
        id: review
        with:
          fail-on-severity: critical
          allow-licenses: GPL-3.0, BSD-3-Clause, MIT
          allow-ghsas: GHSA-abcd-1234-5679, GHSA-efgh-1234-5679
          fail-on-scopes: development, runtime
          output-file: dependency-review.json

      - name: Prepare PR Comment Body
        id: comment
        run: |
          # Default message if file doesn't exist
          if [ ! -f dependency-review.json ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "### Dependency Review Results" >> $GITHUB_OUTPUT
            echo "✅ No vulnerabilities, license issues, or OpenSSF Scorecard issues found." >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract data from JSON
          VULNS=$(jq -r '.vulnerabilities | map("\(.packageName) \(.version) \(.severity)") | .[]?' dependency-review.json)
          LICENSES=$(jq -r '.licenseIssues | map("\(.packageName) \(.license) \(.type)") | .[]?' dependency-review.json)
          SCORECARD=$(jq -r '.scorecards | map("\(.package) \(.version) \(.score)") | .[]?' dependency-review.json)

          echo "### Dependency Review Results" >> temp_comment.md

          if [ -n "$VULNS" ]; then
            echo "#### Vulnerabilities" >> temp_comment.md
            echo '```' >> temp_comment.md
            echo "$VULNS" >> temp_comment.md
            echo '```' >> temp_comment.md
          else
            echo "✅ No vulnerabilities found." >> temp_comment.md
          fi

          if [ -n "$LICENSES" ]; then
            echo "#### License Issues" >> temp_comment.md
            echo '```' >> temp_comment.md
            echo "$LICENSES" >> temp_comment.md
            echo '```' >> temp_comment.md
          else
            echo "✅ No license issues found." >> temp_comment.md
          fi

          if [ -n "$SCORECARD" ]; then
            echo "#### OpenSSF Scorecard" >> temp_comment.md
            echo '```' >> temp_comment.md
            echo "$SCORECARD" >> temp_comment.md
            echo '```' >> temp_comment.md
          else
            echo "✅ OpenSSF Scorecard: all checks passed." >> temp_comment.md
          fi

          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat temp_comment.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment Dependency Review Results on PR
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.comment.outputs.body }}
