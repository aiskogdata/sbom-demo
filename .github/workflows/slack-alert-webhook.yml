name: Slack Notify

on:
  workflow_call:
    inputs:
      message:
        required: false
        type: string
      artifact-name:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      message:
        required: false
        type: string
      artifact-name:
        required: false
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Download artifact if specified
      - name: Download artifact
        if: ${{ inputs.artifact-name }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: artifact_content

      # Prepare message
      - name: Prepare message
        id: prepare
        shell: bash
        run: |
          if [ -n "${{ inputs.message }}" ]; then
            echo "FINAL_MESSAGE=${{ inputs.message }}" >> $GITHUB_ENV
          elif [ -d "artifact_content" ]; then
            MSG=$(cat artifact_content/*)
            # Wrap in triple backticks for Slack code block if artifact
            echo "FINAL_MESSAGE=\`\`\`$MSG\`\`\`" >> $GITHUB_ENV
          else
            echo "FINAL_MESSAGE=No message provided" >> $GITHUB_ENV

      # Send to Slack using the official action
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          slack-message: ${{ env.FINAL_MESSAGE }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
