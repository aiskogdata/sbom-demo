name: Generate SBOM

on:
  push:
    branches: [ first ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SBOM (Anchore)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Comment SBOM link on PR
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            The latest SBOM is available here: [Download SBOM](https://github.com/${{ github.repository }}/suites/${{ github.run_id }}/artifacts)

